<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <h1 class="logo">Task Manager</h1>
      <div class="nav-right">
        <span id="user-name" class="user-name"></span>
        <button id="logout-btn" class="btn btn-secondary">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container main-content">
    <!-- Task Form Section -->
    <section class="task-form-section">
      <h2 id="form-title">Add New Task</h2>
      
      <form id="task-form">
        <input type="hidden" id="task-id">
        
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" name="title" required placeholder="Enter task title" maxlength="100">
        </div>
        
        <div class="form-group">
          <label for="description">Description *</label>
          <textarea id="description" name="description" required placeholder="Enter task description" rows="3" maxlength="500"></textarea>
        </div>
        
        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" name="status" required>
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>
        
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add Task</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
      <h2>My Tasks</h2>
      <div class="filter-controls">
        <label for="filter-status">Filter by Status:</label>
        <select id="filter-status" class="filter-select">
          <option value="">All Tasks</option>
          <option value="To Do">To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
    </section>

    <!-- Task List Section -->
    <section class="task-list-section">
      <div id="loading" class="loading" style="display: none;">Loading tasks...</div>
      <div id="error-message" class="error-message" style="display: none;"></div>
      <div id="task-list" class="task-list">
        <!-- Tasks will be dynamically loaded here -->
      </div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <p>No tasks found. Create your first task to get started!</p>
      </div>
    </section>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal">
    <div class="modal-content">
      <h3>Confirm Delete</h3>
      <p>Are you sure you want to delete this task?</p>
      <div class="modal-actions">
        <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
        <button id="cancel-delete-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
